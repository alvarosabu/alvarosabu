<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <defs>
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      src: url(data:font/woff2;base64,) format('woff2');
    }
  </style>
    <marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a6d189"/>
    </marker>
    <g id="cross">
      <path d="M-11 0 H11 M0 -11 V11" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="1" y="1" width="798" height="558" rx="12" fill="#303446" stroke="#414559" stroke-width="2"/>

  <text x="40" y="52" fill="#a5adce" font-size="17">The blade template: 3 vertices, one shared anchor</text>

  <!-- triangle -->
  <path d="M400 110 L230 430 L570 430 Z" fill="none" stroke="#c6d0f5" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>

  <!-- offset arrows from anchor -->
  <path d="M400 412 V132" fill="none" stroke="#a6d189" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ah-green)"/>
  <path d="M382 448 H248" fill="none" stroke="#a6d189" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ah-green)"/>
  <path d="M418 448 H552" fill="none" stroke="#a6d189" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ah-green)"/>

  <!-- vertices -->
  <use href="#cross" transform="translate(400 110) rotate(8)" stroke="#ca9ee6" stroke-width="6"/>
  <use href="#cross" transform="translate(230 430) rotate(-6)" stroke="#ca9ee6" stroke-width="6"/>
  <use href="#cross" transform="translate(570 430) rotate(5)" stroke="#ca9ee6" stroke-width="6"/>
  <!-- anchor -->
  <use href="#cross" transform="translate(400 430) rotate(-4)" stroke="#ef9f76" stroke-width="7"/>

  <!-- labels -->
  <text x="424" y="104" fill="#ca9ee6" font-size="16">tip (0, 1)</text>
  <text x="212" y="464" text-anchor="middle" fill="#ca9ee6" font-size="16">(-1, 0)</text>
  <text x="588" y="464" text-anchor="middle" fill="#ca9ee6" font-size="16">(1, 0)</text>
  <text x="420" y="404" fill="#ef9f76" font-size="16">anchor (x, z)</text>
  <text x="378" y="280" transform="rotate(-90 378 280)" text-anchor="middle" fill="#a6d189" font-size="15">template.y · bladeHeight</text>
  <text x="486" y="486" text-anchor="middle" fill="#a6d189" font-size="15">template.x · bladeWidth</text>
  <text x="400" y="528" text-anchor="middle" fill="#a5adce" font-size="14">all 3 vertices store the same anchor, the shape template expands them in the vertex stage</text>
</svg>
