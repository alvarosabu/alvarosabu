[build]
command = "pnpm install && NODE_OPTIONS='--max-old-space-size=8192' pnpm generate"
publish = "dist"

[build.environment]
COREPACK_INTEGRITY_KEYS = "0"
NODE_VERSION = "24"
NODE_OPTIONS = "--max-old-space-size=8192"

# Domain migration: applies once alvarosaburido.dev is added as a domain alias of this site
[[redirects]]
from = "https://alvarosaburido.dev/*"
to = "https://alvarosabu.dev/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.alvarosaburido.dev/*"
to = "https://alvarosabu.dev/:splat"
status = 301
force = true

[[redirects]]
from = "/*"
to = "/200.html"
status = 200
